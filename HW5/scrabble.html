<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>One-Line Scrabble</title>

    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
    <script src="scrabble.js"></script>
  </head>
  <body>
    <h1>One-Line Scrabble</h1>

    <!-- Score board -->
    <div id="score-board">Score: <span id="score">0</span></div>
    <!-- Board slots -->
    <div id="board-container">
      <div class="board-slot" data-bonus="none"></div>
      <div class="board-slot" data-bonus="none"></div>
      <div class="board-slot" data-bonus="double-word"></div>
      <div class="board-slot" data-bonus="none"></div>
      <div class="board-slot" data-bonus="none"></div>

      <div class="board-slot" data-bonus="none"></div>

      <div class="board-slot" data-bonus="double-letter"></div>

      <div class="board-slot" data-bonus="none"></div>

      <div class="board-slot" data-bonus="double-letter"></div>

      <div class="board-slot" data-bonus="none"></div>
      <div class="board-slot" data-bonus="none"></div>
      <div class="board-slot" data-bonus="double-letter"></div>
      <div class="board-slot" data-bonus="double-word"></div>
      <div class="board-slot" data-bonus="none"></div>
      <div class="board-slot" data-bonus="none"></div>
    </div>
    <!-- Rack -->
    <div id="rack-container">
      <div id="rack"></div>
    </div>
    <!-- Control buttons -->
    <div id="controls">
      <button id="next-word-btn">Play Word</button>
      <button id="restart-btn">Restart Game</button>
    </div>
    <!-- Message area -->
    <div id="message-area"></div>
  </body>
</html>
